[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labyrinth-tanks"
version = "1.0.0"
description = "A local two-player tank game built with Pygame."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5.8"]

[project.optional-dependencies]
build = ["pyinstaller>=6.18"]

[project.scripts]
labyrinth-tanks = "tanksgame.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
